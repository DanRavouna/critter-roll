<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Critter Roll Map Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap">
<style>
:root{--bg:#171326;--panel:#221C38;--edge:#3A3160;--ink:#F3EEFF;--dim:#A99FCF;--gold:#FFD86B;--warn:#FF8A7A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:700 14px Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;gap:8px;align-items:center;padding:8px;background:var(--panel);flex:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
#top{border-bottom:2px solid var(--edge)}
#strip{border-top:2px solid var(--edge)}#strip2{padding-top:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
button,select{font:inherit;color:var(--ink);background:#2E2650;border:2px solid var(--edge);border-radius:10px;padding:0 14px;cursor:pointer;flex:none;white-space:nowrap;min-height:44px;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--gold)}button.on{border-color:var(--gold);background:#4A3D80;color:var(--gold)}
button:active{transform:scale(.96)}
select{max-width:46vw;text-overflow:ellipsis}
.sep{width:2px;height:30px;background:var(--edge);flex:none}
#stage{flex:1;position:relative;min-height:0;background:#0F0C1C}
#cv{display:block;position:absolute;inset:0;image-rendering:pixelated;cursor:crosshair;touch-action:none}
#pal button{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px}
#pal canvas{width:24px;height:36px;image-rendering:pixelated;border-radius:4px;background:#0F0C1C}
#brush button{min-width:52px;padding:0}
#status{display:flex;gap:14px;padding:4px 10px;background:var(--panel);color:var(--dim);font-size:12px;flex:none;overflow:hidden;white-space:nowrap;font-weight:600}
#msg{color:var(--gold)}#msg.bad{color:var(--warn)}
#menu{position:absolute;right:8px;top:8px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:5;max-width:92vw;box-shadow:0 8px 30px #0008}
#menu.open{display:flex}#menu button{text-align:left}
#menu label{display:flex;gap:8px;align-items:center;color:var(--dim);padding:6px}
#report{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--dim);white-space:pre-wrap;display:none;z-index:4;font-weight:600}
#report.open{display:block}#report b{color:var(--gold);cursor:pointer;float:right;margin-left:8px;font-size:16px}
#ask{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}#ask.open{display:flex}#askbox{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}#asktext{white-space:pre-wrap;line-height:1.45}#askin{font:inherit;color:var(--ink);background:#171326;border:2px solid var(--edge);border-radius:8px;padding:10px;min-height:44px;width:100%}#askin[hidden]{display:none}#askbox .row{display:flex;gap:8px;justify-content:flex-end}
#hint{position:absolute;left:8px;top:8px;color:var(--dim);font-size:12px;font-weight:600;background:#171326CC;padding:4px 8px;border-radius:8px;pointer-events:none;animation:hintfade 8s forwards}@keyframes hintfade{0%,80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="top">
    <select id="mapsel" title="Map"></select>
    <button id="zout" title="Zoom out">−</button><button id="zfit" title="Whole map">Fit</button><button id="zin" title="Zoom in">+</button>
    <span style="flex:1"></span>
    <button id="more" title="More">⋯</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">1 finger paints · 2 fingers move and zoom · hold to pick</div>
    <div id="menu">
      <button id="check">Check walkability</button>
      <button id="playtest">Playtest draft ↗</button>
      <button id="submit" hidden style="border-color:var(--gold);color:var(--gold)">Submit to the game</button>
      <button id="export">Export mapedits.json</button>
      <button id="import">Import mapedits.json…</button><input id="file" type="file" accept=".js,.json" hidden>
      <button id="reset">Reset this map to generated</button>
      <label><input type="checkbox" id="oGrid" checked> grid</label>
      <label><input type="checkbox" id="oMark" checked> exits, places, signs, objects</label>
      <label><input type="checkbox" id="oEdit" checked> outline my edits</label>
      <div style="color:var(--dim);font-size:12px;padding:4px 6px;line-height:1.6;font-weight:600">Mouse: right-click picks · Ctrl+wheel zooms · wheel pans<br>Keys: B paint · R box · F fill · E restore · 1 2 3 brush · Ctrl+Z / Ctrl+Y</div>
    </div>
    <div id="report"><b id="repclose">✕</b><span id="reptext"></span></div>
    <div id="ask"><div id="askbox"><div id="asktext"></div><input id="askin" type="text" maxlength="200" autocomplete="off"><div class="row"><button id="askno">Cancel</button><button id="askok" style="border-color:var(--gold);color:var(--gold)">OK</button></div></div></div>
  </div>
  <div class="bar" id="strip"><button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button><span class="sep"></span><span id="tools" style="display:contents"></span><span class="sep"></span><span id="brush" style="display:contents"></span></div>
  <div class="bar" id="strip2"><span id="pal" style="display:contents"></span></div>
  <div id="status"><span id="pos">–</span><span id="info"></span><span id="msg"></span></div>
</div>
<script>
window.__EDITOR = true;
// ---- PIX: turns the game's critter geometry into pixel-art sprites ----
const PIX = (() => {
  const cache = new Map();
  function parseColor(str) {
    if (!str) return [0, 0, 0, 0];
    str = str.trim();
    if (str[0] === '#') { const n = parseInt(str.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 1]; }
    const m = str.match(/rgba?\(([^)]+)\)/);
    if (m) { const p = m[1].split(',').map((x) => parseFloat(x)); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; }
    return [0, 0, 0, 0];
  }
  const css = (c) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + c[3] + ')';
  function radii(str, w, h) {
    const [hs, vs] = String(str).split('/');
    const expand = (s) => { const t = s.trim().split(/\s+/); if (t.length === 1) return [t[0], t[0], t[0], t[0]]; if (t.length === 2) return [t[0], t[1], t[0], t[1]]; if (t.length === 3) return [t[0], t[1], t[2], t[1]]; return t; };
    const H = expand(hs), V = expand(vs || hs);
    const val = (tok, size) => tok.endsWith('%') ? parseFloat(tok) / 100 * size : parseFloat(tok) || 0;
    const r = [0, 1, 2, 3].map((i) => ({ x: val(H[i], w), y: val(V[i], h) }));
    const f = Math.min(1, w / ((r[0].x + r[1].x) || 1), w / ((r[3].x + r[2].x) || 1), h / ((r[0].y + r[3].y) || 1), h / ((r[1].y + r[2].y) || 1));
    r.forEach((q) => { q.x = Math.max(0.01, q.x * f); q.y = Math.max(0.01, q.y * f); });
    return r;
  }
  function shape(g, x, y, w, h, rad, rot) {
    const [tl, tr, br, bl] = radii(rad, w, h);
    g.save(); g.translate(x + w / 2, y + h / 2); g.rotate((rot || 0) * Math.PI / 180); g.translate(-w / 2, -h / 2);
    g.beginPath(); g.moveTo(tl.x, 0); g.lineTo(w - tr.x, 0); g.ellipse(w - tr.x, tr.y, tr.x, tr.y, 0, -Math.PI / 2, 0);
    g.lineTo(w, h - br.y); g.ellipse(w - br.x, h - br.y, br.x, br.y, 0, 0, Math.PI / 2);
    g.lineTo(bl.x, h); g.ellipse(bl.x, h - bl.y, bl.x, bl.y, 0, Math.PI / 2, Math.PI);
    g.lineTo(0, tl.y); g.ellipse(tl.x, tl.y, tl.x, tl.y, 0, Math.PI, Math.PI * 1.5); g.closePath();
    g.restore();
  }
  const mix = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), 1];
  // ---- facings (Dan, Nov 2026: eight directions, a real second drawing from the same parts, not a flip of the front) ----
  // Every facing is the critter's own geometry re-arranged: the back shows the parts mirrored with no face and the tail in front of the body; the profile is the body narrowed to 0.8 with one eye and the mouth at the far edge and the tail behind; the quarter views sit between (0.92 wide, the face shifted toward the facing). Left facings mirror the right ones.
  const FACE = { down: { c: 1, mirror: false, face: 'front' }, up: { c: 1, mirror: true, face: 'none', tailFront: true }, right: { c: 0.8, mirror: false, face: 'side', tailBack: true }, left: { c: 0.8, mirror: true, face: 'side', tailBack: true },
    downright: { c: 0.92, mirror: false, face: 'quarter' }, downleft: { c: 0.92, mirror: true, face: 'quarter' }, upright: { c: 0.92, mirror: true, face: 'none', sliver: true, tailFront: true }, upleft: { c: 0.92, mirror: false, face: 'none', sliver: true, tailFront: true } };   // sliver: the outer third of one eye shows at the far edge of the back quarter, clipped by the body
  const mirrorR = (r) => String(r).split(' / ').map((s) => { const t = s.trim().split(/\s+/); if (t.length === 1) return t[0]; if (t.length === 2) return t[1] + ' ' + t[0]; if (t.length === 3) return t[1] + ' ' + t[0] + ' ' + t[1]; return t[1] + ' ' + t[0] + ' ' + t[3] + ' ' + t[2]; }).join(' / ');
  function geometry(k, facing) {
    const F = FACE[facing] || FACE.down, c = F.c, body = k.body, isTail = (p) => p.x + p.w / 2 > body.x + body.w * 0.72 && p.y + p.h / 2 > body.y + body.h * 0.35;
    const tx = (p, flip) => { let x = 120 + (p.x + p.w / 2 - 120) * c - p.w * c / 2, w = p.w * c, r = p.r, rot = p.rot || 0; if (flip) { x = 240 - x - w; r = mirrorR(r); rot = -rot; } return Object.assign({}, p, { x: x, w: w, r: r, rot: rot }); };
    const parts = (k.parts || []).map((p) => tx(p, F.mirror !== !!(F.tailBack && isTail(p)))), over = (k.over || []).map((p) => tx(p, F.mirror)), bodyT = tx(body, F.mirror), belly = tx(k.belly, F.mirror), mouth = tx(k.mouth, F.mirror), eyeRow = tx(k.eyeRow, F.mirror);
    const back = parts.filter((p, i) => !(F.tailFront && isTail((k.parts || [])[i]))), front = parts.filter((p, i) => F.tailFront && isTail((k.parts || [])[i]));
    return { F: F, back: back, front: front, over: over, body: bodyT, belly: belly, mouth: mouth, eyeRow: eyeRow, shift: (F.face === 'quarter' ? 0.1 : (F.face === 'side' ? 0.28 : 0)) * bodyT.w * (F.mirror ? -1 : 1) };
  }
  function draw(k, S, mode, facing) {
    const Wd = Math.round(240 * S), Ht = Math.round(210 * S), G = geometry(k, facing || 'down'), F = G.F;
    const c = document.createElement('canvas'); c.width = Wd; c.height = Ht;
    const g = c.getContext('2d'); g.scale(S, S);
    const body = parseColor(k.bodyColor), ink = parseColor('#1E2340');
    const fillOf = (bg) => (typeof bg === 'string' && bg.indexOf('gradient') !== -1) ? body : parseColor(bg);
    const partFill = (p) => { if (p.bw === 0 && /rgba\(255,216,77/.test(p.bg)) return; const col = fillOf(p.bg); g.fillStyle = css(col); shape(g, p.x, p.y, p.w, p.h, p.r, p.rot); g.fill(); };
    G.back.forEach(partFill);
    g.fillStyle = css(body); shape(g, G.body.x, G.body.y, G.body.w, G.body.h, G.body.r, 0); g.fill();
    if (F.face !== 'none') { g.fillStyle = k.bellyBg; g.beginPath(); g.ellipse(G.belly.x + G.belly.w / 2 + G.shift * 0.6, G.belly.y + G.belly.h / 2, G.belly.w / 2 * (F.face === 'side' ? 0.7 : 1), G.belly.h / 2, 0, 0, 6.3); g.fill(); }
    else { const lo2 = mix(body, [0, 0, 0], 0.18); g.fillStyle = css(lo2); g.beginPath(); g.ellipse(G.body.x + G.body.w / 2, G.body.y + G.body.h * 0.42, G.body.w * 0.1, G.body.h * 0.3, 0, 0, 6.3); g.fill(); }   // from behind: no face, a darker line down the back
    G.front.forEach(partFill);
    if (F.face !== 'none') G.over.forEach((o) => { g.fillStyle = o.bg; shape(g, o.x, o.y, o.w, o.h, o.r, o.rot); g.fill(); });
    if (F.sliver && k.eyes.length) { const s0 = k.eyes[0].s, cxS = G.body.x + G.body.w * (F.mirror ? 0.04 : 0.96), cyS = k.eyeRow.y + s0 / 2; g.save(); shape(g, G.body.x, G.body.y, G.body.w, G.body.h, G.body.r, 0); g.clip(); g.fillStyle = css(ink); g.beginPath(); g.arc(cxS + (F.mirror ? -s0 * 0.22 : s0 * 0.22), cyS, s0 / 2, 0, 6.3); g.fill(); g.restore(); }   // the back quarter: a sliver of one eye at the far edge
    const eyesDrawn = F.face === 'none' ? [] : (F.face === 'side' ? [k.eyes[k.eyes.length - 1]] : k.eyes);
    const n = eyesDrawn.length, s = n ? k.eyes[0].s : 0, total = n * s + (n - 1) * 8, sx = (F.face === 'side' ? G.body.x + G.body.w * (F.mirror ? 0.2 : 0.8) - s / 2 : G.eyeRow.x + (G.eyeRow.w - total) / 2 + G.shift);
    eyesDrawn.forEach((e, i) => {
      const ex = sx + i * (s + 8), ey = k.eyeRow.y, cxE = ex + s / 2, cyE = ey + s / 2;
      g.fillStyle = css(ink); g.beginPath(); g.arc(cxE, cyE, s / 2, 0, 6.3); g.fill();
      if (mode === 'icon') return;
      g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(cxE, cyE, s / 2 - 3.5, 0, 6.3); g.fill();
      const ps = e.ps, px = k.look === 'flex-start' ? ex + 5 + ps / 2 : (k.look === 'flex-end' ? ex + s - 5 - ps / 2 : cxE);
      g.fillStyle = css(ink); g.beginPath(); g.arc(px, cyE, ps / 2 + (mode === 'icon' ? 1.5 : 0.5), 0, 6.3); g.fill();
      if (mode === 'big') { g.fillStyle = '#FFFFFF'; g.fillRect(px - ps / 2 + 0.5, cyE - ps / 2 + 0.5, Math.max(4, ps * 0.4), Math.max(4, ps * 0.4)); }
    });
    const m = Object.assign({}, G.mouth, { x: G.mouth.x + G.shift * (F.face === 'side' ? 0.9 : 0.8), w: G.mouth.w * (F.face === 'side' ? 0.6 : 1) });
    g.fillStyle = css(ink);
    if (F.face === 'none') {}
    else if (m.bg === 'transparent') { g.lineWidth = 4; g.strokeStyle = css(ink); g.beginPath(); g.ellipse(m.x + m.w / 2, m.y, m.w / 2, m.h, 0, 0.15, Math.PI - 0.15); g.stroke(); }
    else if (m.bg === '#FFFFFF') { g.fillRect(m.x, m.y, m.w, m.h); g.fillStyle = '#FFFFFF'; g.fillRect(m.x + 3, m.y + 2, m.w - 6, m.h - 5); }
    else { g.beginPath(); g.ellipse(m.x + m.w / 2, m.y + m.h / 2, m.w / 2 + 1, Math.max(2.5, m.h / 2 + 1), 0, 0, 6.3); g.fill(); }
    // ---- pixel pass ----
    const img = g.getImageData(0, 0, Wd, Ht), d = img.data;
    const at = (x, y) => (x < 0 || y < 0 || x >= Wd || y >= Ht) ? 0 : d[(y * Wd + x) * 4 + 3];
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 120) { d[i + 3] = 0; } else d[i + 3] = 255; }
    const outline = parseColor(k.outline || '#1E2340');
    const near = (i, col, tol) => Math.abs(d[i] - col[0]) + Math.abs(d[i + 1] - col[1]) + Math.abs(d[i + 2] - col[2]) < tol;
    if (mode === 'silhouette') {
      for (let i = 0; i < d.length; i += 4) if (d[i + 3]) { d[i] = 70; d[i + 1] = 84; d[i + 2] = 122; }
    } else if (mode === 'icon') {
      const light = [255, 248, 232];
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        const lum = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
        const col = lum < 0.22 ? outline : (lum > 0.82 ? light : body);
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
      }
    } else {
      const hi = mix(body, [255, 255, 255], 0.35), lo = mix(body, [0, 0, 0], 0.22);
      const copy = new Uint8ClampedArray(d);
      for (let y = 0; y < Ht; y++) for (let x = 0; x < Wd; x++) {
        const i = (y * Wd + x) * 4; if (!copy[i + 3] || !near(i, body, 60)) continue;
        const up = at(x, y - 1), left = at(x - 1, y), down = at(x, y + 1), right = at(x + 1, y), down2 = at(x, y + 2);
        let col = null;
        if (!up || !left) col = hi; else if (!down || !right || !down2) col = lo;
        if (col) { d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; }
      }
    }
    // outline around the whole sprite
    const ol = mode === 'silhouette' ? [43, 53, 85, 1] : outline, mark = [];
    for (let y = 0; y < Ht; y++) for (let x = 0; x < Wd; x++) { if (at(x, y)) continue; if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) mark.push((y * Wd + x) * 4); }
    mark.forEach((i) => { d[i] = ol[0]; d[i + 1] = ol[1]; d[i + 2] = ol[2]; d[i + 3] = 255; });
    // mythic sparkles as crisp pixels
    if (mode === 'big' && k.fx) k.fx.forEach((f) => {
      const fx0 = F.mirror ? 240 - f.x - f.s : f.x, x0 = Math.round((fx0 + f.s / 2) * S), y0 = Math.round((f.y + f.s / 2) * S);   // the sparkles turn with the facing
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => { const x = x0 + a, y = y0 + b; if (x >= 0 && y >= 0 && x < Wd && y < Ht) { const i = (y * Wd + x) * 4; const isC = a === 0 && b === 0; d[i] = 255; d[i + 1] = isC ? 255 : 216; d[i + 2] = isC ? 255 : 107; d[i + 3] = 255; } });
    });
    g.setTransform(1, 0, 0, 1, 0, 0); g.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  function sprite(k, mode, facing) {
    mode = mode || 'big'; facing = facing || 'down';
    const key = k.seed + ':' + k.stage + ':' + mode + ':' + facing;
    if (!cache.has(key)) cache.set(key, draw(k, mode === 'big' ? 0.25 : 0.075, mode, facing));
    return cache.get(key);
  }
  // what a facing does to a critter, for tests: how many eyes it draws, whether it is mirrored, how wide the body is, how many parts sit in front of the body
  const plan = (k, facing) => { const G = geometry(k, facing || 'down'); return { face: G.F.face, eyes: G.F.face === 'none' ? 0 : (G.F.face === 'side' ? 1 : k.eyes.length), sliver: !!G.F.sliver, mirror: !!G.F.mirror, bodyW: Math.round(G.body.w), front: G.front.length, back: G.back.length }; };
  return { sprite, radii, parseColor, plan, FACINGS: Object.keys(FACE) };
})();

// ---- LAND: reusable landmarks (props) any map can use. Add a def here, then list it in a map's props (see PROPS in world.js) ----
// A def: { w, h, foot, draw(g, X, Y, P, k), text }
//   w, h   size in tiles
//   foot   rows of w chars: 'X' = solid tile, '.' = walkable (left as ground). Default: every tile solid.
//   draw   pixel art at 16 px per tile; (X, Y) is the top-left pixel; P = the map palette (P.g ground, P.gt grass shade, ...); k = 0..1 per-prop variation
//   text   optional lore line shown on a signpost placed next to the prop (override per use)
// Props never take part in M.places (no door, no name tag): they are scenery plus an optional signpost.
const LAND = (() => {
  const OL = '#2B2235';
  const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const shadow = (g, X, Y, w, h) => R(g, X + 2, Y + h - 3, w - 4, 3, 'rgba(0,0,0,0.2)');
  const moss = (g, P, x, y, w) => R(g, x, y, w, 2, P.gt || '#4E9A3E');
  const defs = {
    // a crumbled stone arch with rubble (any wild route or city outskirts)
    ruin: { w: 4, h: 3, text: 'Worn carvings on the old arch show critters of every type sharing one fire. Nobody remembers who built it.',
      draw(g, X, Y, P, k) {
        shadow(g, X, Y, 64, 48);

    TILES.forEach((t) => { const b = document.createElement('button'); b.dataset.c = t[0]; b.title = t[1]; b.appendChild(tileArt(t[0])); const s = document.createElement('span'); s.textContent = t[1]; b.appendChild(s); b.classList.toggle('on', t[0] === ch); b.onclick = () => setCh(t[0]); pal.appendChild(b); });
  }
  TOOLS.forEach((t) => { const b = document.createElement('button'); b.dataset.t = t[0]; b.textContent = t[1]; b.onclick = () => setTool(t[0]); $('tools').appendChild(b); });
  [1, 2, 3].forEach((n) => { const b = document.createElement('button'); b.dataset.n = n; b.textContent = n + '×' + n; b.onclick = () => setBrush(n); $('brush').appendChild(b); });
  setTool('paint'); setBrush(1);

  // ---------- walkability ----------
  function check() {
    if (!M) return; const g = M.grid, W = M.W, H = M.H, starts = [];
    const walk = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !SOLID.has(g[y][x]);
    if (M.spawn) starts.push([Math.floor(M.spawn[0]), Math.floor(M.spawn[1])]);
    Object.keys(M.arrive || {}).forEach((k) => { const a = M.arrive[k]; starts.push([Math.floor(a[0]), Math.floor(a[1])]); });
    Object.keys(M.arriveFrom || {}).forEach((k) => { const a = M.arriveFrom[k]; starts.push([Math.floor(a[0]), Math.floor(a[1])]); });
    const goals = [];
    (M.exits || []).forEach((e) => { for (let k = e.a; k <= e.b; k++) goals.push([e.edge === 'w' ? 0 : e.edge === 'e' ? W - 1 : k, e.edge === 'n' ? 0 : e.edge === 's' ? H - 1 : k, 'exit to ' + e.to]); });
    (M.places || []).forEach((p) => { if (p.door) goals.push([p.door[0], p.door[1] + 1, 'door of ' + (p.name || p.id)]); });
    if (!starts.length) { report('No start point known for this map, so nothing to check.'); return; }
    const seen = new Set(); const q = starts.filter((s) => walk(s[0], s[1])); q.forEach((s) => seen.add(s[0] + ',' + s[1]));
    for (let i = 0; i < q.length; i++) { const p = q[i]; [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach((d) => { const x = p[0] + d[0], y = p[1] + d[1], k = x + ',' + y; if (walk(x, y) && !seen.has(k)) { seen.add(k); q.push([x, y]); } }); }
    const bad = goals.filter((t) => !seen.has(t[0] + ',' + t[1]));
    flags = bad.map((t) => [t[0], t[1]]);
    const blockedStarts = starts.filter((s) => !walk(s[0], s[1])).length;
    report((bad.length || blockedStarts ? '' : 'Every exit and door can be reached from the start point(s).') + (blockedStarts ? blockedStarts + ' start point(s) are on a solid tile.\n' : '') + bad.map((t) => 'Not reachable: ' + t[2] + ' (' + t[0] + ',' + t[1] + ')').join('\n') + '\n(4-way walking over non-solid tiles; the game\'s own collision may be a little more forgiving.)');
    render();
  }

  // ---------- in-page dialogs (the browser's prompt/confirm are blocked inside the claude.ai page) ----------
  function ask(text, withInput) {
    return new Promise((res) => {
      const box = $('ask'), inp = $('askin'); $('asktext').textContent = text; inp.hidden = !withInput; inp.value = ''; box.classList.add('open');
      const done = (v) => { box.classList.remove('open'); $('askok').onclick = $('askno').onclick = null; inp.onkeydown = null; res(v); };
      $('askok').onclick = () => done(withInput ? inp.value : true); $('askno').onclick = () => done(withInput ? null : false);
      inp.onkeydown = (e) => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); };
      if (withInput) setTimeout(() => inp.focus(), 50);
    });
  }
  // ---------- file, playtest, view ----------
  function exportFile() {
    const d = toData(), ids = Object.keys(d);
    const txt = ids.length ? '{\n' + ids.map((id) => '  ' + JSON.stringify(id) + ': ' + JSON.stringify(d[id])).join(',\n') + '\n}\n' : '{}\n';
    const done = () => msg('Exported ' + ids.length + ' edited map(s) as mapedits.json: put it in src/world/ and rebuild.');
    if (saver) { saver.save({ filename: 'mapedits.json', data: txt }).then(done, (e) => msg(e && e.code === 'declined' ? 'Export cancelled.' : 'Export failed (' + ((e && e.code) || 'unavailable') + ').', true)); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = 'mapedits.json'; a.click(); done();
  }
  // Hosted as a claude.ai page the file goes through the viewer's save prompt (the downloads capability); elsewhere a plain download.
  let saver = null; if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((ns) => { saver = ns; }, () => {});
  $('export').onclick = exportFile;
  $('import').onclick = () => $('file').click();
  $('file').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = async () => { try { const s = String(r.result), d = JSON.parse(s.slice(s.indexOf('{'), s.lastIndexOf('}') + 1)); if (!(await ask('Replace the current edits with the ones in this file?'))) return; load(d); saveDraft(); listMaps(); dirtyTerrain = true; render(); msg('Imported.'); } catch (x) { msg('That file could not be read as map edits.', true); } };
    r.readAsText(f); e.target.value = '';
  };
  // Playtest: next to the game (GitHub Pages, a local build) the draft travels through this browser's storage; hosted elsewhere (a private claude.ai page) it travels in the URL.
  const GAME = 'https://danravouna.github.io/critter-roll/';
  const local = /^(https?:|file:)/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.host);
  $('playtest').onclick = () => {
    saveDraft(); if (local) { window.open('index.html?mapedits=local', '_blank'); return; }
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(toData())))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    if (b64.length > 60000) { msg('This draft is too large to carry in a link (' + b64.length + ' characters); export it instead.', true); return; }
    window.open(GAME + '#mapedits=' + b64, '_blank');
  };
  $('check').onclick = () => check();
  // ---------- Submit: push mapedits.json to main through the viewer's GitHub connector (claude.ai page only). A GitHub Action on main then rebuilds index.html, runs the smoke tests and deploys. ----------
  const GH = { server: 'github', owner: 'danravouna', repo: 'critter-roll', path: 'src/world/mapedits.json', branch: 'main' };
  let mcp = null; if (window.claude && typeof window.claude.use === 'function') window.claude.use('mcp').then((ns) => { mcp = ns; if (ns) $('submit').hidden = false; }, () => {});
  const jsonText = () => { const d = toData(), ids = Object.keys(d); return ids.length ? '{\n' + ids.map((id) => '  ' + JSON.stringify(id) + ': ' + JSON.stringify(d[id])).join(',\n') + '\n}\n' : '{}\n'; };
  function unreachable() {   // every edited map must pass the walkability check before it goes live
    const out = [], keep = cur; Object.keys(edits).forEach((id) => { open(id); check(); if (flags && flags.length) out.push(MAPS[id].name || id); });
    open(keep); return out;
  }
  $('submit').onclick = async () => {
    if (!mcp) return; const ids = Object.keys(edits);
    if (!ids.length) { report('Nothing to submit: no map differs from the generated one.'); return; }
    report('Checking that every exit and door can still be reached…'); const bad = unreachable(); if (bad.length) { report('Not submitted. An exit or a door cannot be reached on: ' + bad.join(', ') + '. Fix those first (⋯ → Check walkability shows them in red).'); return; }
    report(''); const note = await ask('One line for the commit: what do these edits mean inside the quest?\n(Maps: ' + ids.map((id) => MAPS[id].name || id).join(', ') + ')', true); if (note == null) return;
    if (!note.trim()) { report('Not submitted: a meaning line is required (the standing rule: every place says its piece of the meaning).'); return; }
    report('Submitting…'); $('submit').disabled = true;
    try {
      let sha; try { const r = await mcp.callTool(GH.server, 'get_file_contents', { owner: GH.owner, repo: GH.repo, path: GH.path, ref: 'refs/heads/' + GH.branch }, { cache: false }); const m = /SHA: ([0-9a-f]{40})/.exec(JSON.stringify(r)); sha = m ? m[1] : undefined; } catch (e) { if (!e || e.code !== 'tool_error') throw e; }
      const input = { owner: GH.owner, repo: GH.repo, path: GH.path, branch: GH.branch, content: jsonText(), message: 'Map edits from the editor: ' + note.trim() + '\n\nMaps: ' + ids.join(', ') + '. Submitted from the map editor page; index.html is rebuilt by the mapedits workflow.' };
      if (sha) input.sha = sha;
      const r = await mcp.callTool(GH.server, 'create_or_update_file', input);
      const url = (JSON.stringify(r).match(/https:\/\/github\.com\/[^"\\]*\/commit\/[0-9a-f]+/) || [])[0];
      report('Submitted to main. GitHub now rebuilds the game and runs the smoke tests; the site updates in a few minutes if they pass (you get an email from GitHub if they do not).' + (url ? '\nCommit: ' + url : ''));
    } catch (e) {
      const c = e && e.code;
      report(c === 'server_not_connected' ? 'GitHub is not connected: add GitHub in claude.ai Settings → Connectors, then try again.'
        : c === 'needs_reauth' ? 'GitHub needs to be reconnected in claude.ai Settings → Connectors.'
        : c === 'approval_required' || c === 'consent_required' ? 'Not submitted: the page needs your approval to use GitHub. Allow it when asked and press Submit again.'
        : c === 'not_in_manifest' || c === 'blocked_by_policy' ? 'Not submitted: this page is not allowed to use GitHub for you (' + c + ').'
        : c === 'tool_error' ? 'GitHub refused the change: ' + (e.message || '') : 'Not submitted (' + (c || 'error') + '): ' + (e && e.message || '') + (c === 'server_unavailable' || c === 'upstream_error' ? ' Check the repository before trying again: the commit may still have happened.' : ''));
    }
    $('submit').disabled = false;
  };
  $('undo').onclick = () => step(undo, redo, true);
  $('redo').onclick = () => step(redo, undo, false);
  $('reset').onclick = async () => { if (!M || !edits[cur] || !(await ask('Throw away every edit on this map?'))) return; load(Object.assign({}, toData(), { [cur]: { cells: [] } })); undo[cur] = []; redo[cur] = []; saveDraft(); open(cur); msg('Map reset.'); };
  $('zin').onclick = () => { const c = centre(); zoomAt(cam.z * 1.25, c[0], c[1]); }; $('zout').onclick = () => { const c = centre(); zoomAt(cam.z / 1.25, c[0], c[1]); }; $('zfit').onclick = fit;
  $('oGrid').onchange = render; $('oMark').onchange = render; $('oEdit').onchange = render; $('mapsel').onchange = (e) => open(e.target.value);
  $('more').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('open'); };
  $('menu').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') $('menu').classList.remove('open'); });
  stage().addEventListener('pointerdown', (e) => { if (!$('menu').contains(e.target) && e.target !== $('more')) $('menu').classList.remove('open'); });
  $('repclose').onclick = () => { report(''); flags = null; render(); };
  window.addEventListener('resize', () => { if (M) { clampCam(); render(); } });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); step(undo, redo, true); return; }
    if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); step(redo, undo, false); return; }
    const t = TOOLS.find((x) => x[2] === k); if (t) setTool(t[0]);
    if (k === '1' || k === '2' || k === '3') setBrush(+k);
    const tl = TILES.find((x) => x[0] === e.key); if (tl) setCh(tl[0]);
  });
  window.addEventListener('beforeunload', () => { if (Object.keys(edits).length) saveDraft(); });

  // start: the committed edits (mapedits.json) are the base state; a draft in this browser, if any, replaces them
  load(typeof MAPEDITS !== 'undefined' ? MAPEDITS : {});
  try { const d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); if (d && Object.keys(d).length) { load(d); msg('Loaded your draft from this browser.'); } } catch (e) { /* no draft */ }
  open(MAPS.town ? 'town' : Object.keys(MAPS)[0]);
})();


</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critter Roll Map Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap">
<style>
:root{--bg:#171326;--panel:#221C38;--edge:#3A3160;--ink:#F3EEFF;--dim:#A99FCF;--gold:#FFD86B;--warn:#FF8A7A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px Nunito,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);flex:none;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
#top{border-bottom:2px solid var(--edge)}
#strip{border-top:2px solid var(--edge)}#strip2{padding-top:0}
button,select{font:inherit;color:var(--ink);background:#2E2650;border:2px solid var(--edge);border-radius:8px;padding:6px 10px;cursor:pointer;flex:none;white-space:nowrap;min-height:36px}
button:hover{border-color:var(--gold)}button.on{border-color:var(--gold);background:#4A3D80}
select{max-width:46vw;text-overflow:ellipsis}
.sep{width:2px;height:28px;background:var(--edge);flex:none;margin:0 2px}
#stage{flex:1;overflow:auto;background:#0F0C1C;position:relative;min-height:0}
#cv{display:block;image-rendering:pixelated;cursor:crosshair;margin:8px;touch-action:none}
#stage.pan #cv{touch-action:auto;cursor:grab}
#strip2 button i{width:18px;height:18px;border-radius:4px;border:2px solid #0008;display:inline-grid;place-items:center;font:700 11px monospace;font-style:normal;color:#000a;vertical-align:-4px;margin-right:5px}
#status{display:flex;gap:14px;padding:5px 10px;background:var(--panel);border-top:2px solid var(--edge);color:var(--dim);font-size:12px;flex:none;overflow:hidden;white-space:nowrap}
#msg{color:var(--gold)}#msg.bad{color:var(--warn)}
#menu{position:absolute;right:8px;top:52px;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:5;max-width:92vw}
#menu.open{display:flex}#menu button{text-align:left}
#menu label{display:flex;gap:6px;align-items:center;color:var(--dim);padding:4px 6px}
#report{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--dim);white-space:pre-wrap;display:none;z-index:4}
#report.open{display:block}#report b{color:var(--gold);cursor:pointer;float:right;margin-left:8px}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="top">
    <select id="mapsel" title="Map"></select>
    <button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button>
    <button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit the map to the screen">Fit</button><button id="zin" title="Zoom in">+</button>
    <span style="flex:1"></span>
    <button id="more" title="More">⋯</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="menu">
      <button id="check">Check walkability</button>
      <button id="playtest">Playtest draft ↗</button>
      <button id="export">Export mapedits.json</button>
      <button id="import">Import mapedits.json…</button><input id="file" type="file" accept=".js,.json" hidden>
      <button id="reset">Reset this map to generated</button>
      <label><input type="checkbox" id="oGrid" checked> grid</label>
      <label><input type="checkbox" id="oMark" checked> exits, places, signs, objects</label>
      <div style="color:var(--dim);font-size:12px;padding:4px 6px;line-height:1.6">Keys: B paint · R rectangle · F fill · I pick · E restore · H pan<br>right-click = pick · Ctrl+Z / Ctrl+Y · Ctrl+wheel = zoom</div>
    </div>
    <div id="report"><b id="repclose">✕</b><span id="reptext"></span></div>
  </div>
  <div class="bar" id="strip"><span id="tools" style="display:contents"></span></div>
  <div class="bar" id="strip2"><span id="pal" style="display:contents"></span></div>
  <div id="status"><span id="pos">–</span><span id="info"></span><span id="msg"></span></div>
</div>
<script>
window.__EDITOR = true;
/*@@JS@@*/
</script>
</body>
</html>
